# Garage (S3-compatible object storage), single node for local development.
# Secrets are NOT stored here: GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN come from the environment (.env).

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Must be equal to AWS_DEFAULT_REGION in .env (docker/garage/entrypoint.sh checks it).
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
# Only reachable from inside the container.
api_bind_addr = "127.0.0.1:3903"
