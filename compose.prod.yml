# Production stack, for the VPS.
#   First install:  docker compose -f compose.prod.yml up -d --build
#   Every deploy:   scripts/deploy.sh (run by .github/workflows/deploy.yml), with no downtime:
#                   the app is rolled out with `docker rollout`, Caddy is reloaded, never restarted.
# The code is baked into the `app` image (target `app` of the Dockerfile).
# No secrets here: every value comes from `.env` (see the production section of .env.example).

x-php-service: &php-service
  image: app-prod
  pull_policy: never # built by the `migrate` service
  volumes:
    - ./.env:/var/www/html/.env:ro

  environment: &php-env
    # Force secure production settings.
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env}

    # Inside Docker the services are reached by name, not 127.0.0.1.
    DB_HOST: postgres
    DB_PORT: "5432"
    AWS_ENDPOINT: http://garage:3900
    LOG_CHANNEL: stderr

  depends_on: &php-depends
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  # Runs once on each deploy, before the app and the workers start.
  migrate:
    <<: *php-service
    build:
      context: .
      target: app
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
        NODE_VERSION: ${NODE_VERSION:-24}
    command: ["sh", "-c", "php artisan migrate --force && (php artisan storage:cors || echo 'WARNING: could not set the bucket CORS rules' >&2)"]
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: "no"

  app:
    <<: *php-service
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Copies the static files of the new image (public/) into the volume Caddy serves, before the app
  # is rolled out. Vite gives assets hashed names, so pages of the old version still find theirs.
  assets:
    image: app-prod
    pull_policy: never
    user: root
    entrypoint: ["sh", "-c", "cp -a /var/www/html/public/. /assets/"]
    volumes:
      - public-assets:/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Stock Caddy image: a deploy never restarts it, `caddy reload` applies a new Caddyfile without
  # dropping connections. The directory is mounted (not the file) so a git checkout is seen.
  web:
    image: caddy:${CADDY_VERSION:-2.10}-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.prod", "--adapter", "caddyfile"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
      S3_SITE_ADDRESS: ${S3_SITE_ADDRESS:?Set S3_SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./docker/caddy:/etc/caddy:ro
      - public-assets:/var/www/html/public:ro
      - caddy-data:/data # certificates: keep this volume
      - caddy-config:/config
    depends_on:
      assets:
        condition: service_completed_successfully
      app:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped

  # On a deploy, a worker gets SIGTERM, finishes its current job, then exits (stop_grace_period).
  queue:
    <<: *php-service
    command: ["php", "artisan", "queue:work", "--queue=default", "--tries=3", "--sleep=3", "--max-time=3600"]
    stop_grace_period: 60s

  # Long jobs on the database_long connection, one worker per queue (ADR-0006).
  queue-transcoding:
    <<: *php-service
    command: ["php", "artisan", "queue:work", "database_long", "--queue=transcoding", "--timeout=3600", "--tries=2", "--sleep=3", "--max-time=7200"]
    stop_grace_period: 5m

  queue-transcription:
    <<: *php-service
    command: ["php", "artisan", "queue:work", "database_long", "--queue=transcription", "--timeout=3600", "--tries=2", "--sleep=3", "--max-time=7200"]
    stop_grace_period: 5m

  scheduler:
    <<: *php-service
    command: ["php", "artisan", "schedule:work"]

  # No published port: only reachable by the other containers.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # No published port: the browser reaches the S3 API through Caddy (S3_SITE_ADDRESS).
  garage:
    build:
      context: ./docker/garage
    image: app-garage
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN in .env}
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-50G}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:?Set AWS_DEFAULT_REGION in .env}
      AWS_BUCKET: ${AWS_BUCKET:?Set AWS_BUCKET in .env}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/garage-ready"] # created once layout, bucket and key exist
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:
  public-assets:
